name: Deploy Pages with local homework PDFs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify local homework PDFs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          documents = json.loads(Path('assignments/documents.json').read_text())
          sizes = json.loads(Path('assignments/font-sizes.json').read_text())
          themes = json.loads(Path('assignments/themes.json').read_text())
          for name in documents:
              for size in sizes:
                  for theme in themes:
                      suffix = ('' if size == 'default' else f'-{size}') + ('' if theme == 'blue' else f'-{theme}')
                      pdf = Path('pdf') / f'{Path(name).stem}{suffix}.pdf'
                      if not pdf.is_file() or not pdf.read_bytes().startswith(b'%PDF-'):
                          raise SystemExit(f'Missing or invalid PDF: {pdf}. Run scripts/build_pdf.py locally before publishing.')
          print('All local homework PDFs verified.')
          PY
      - name: Install textbook PDF tools
        run: python3 -m pip install --disable-pip-version-check PyMuPDF==1.28.2
      - name: Build textbook section downloads
        run: python3 scripts/build_textbook_downloads.py
      - name: Prepare static site
        run: |
          mkdir _site
          cp *.html *.css *.js .nojekyll _site/
          cp -r assignments vendor files _site/
          cp -r textbook downloads _site/
          mkdir _site/pdf
          cp pdf/*.pdf _site/pdf/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
